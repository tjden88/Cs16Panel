services:
  cs16-panel:
    build:
      context: ./cs16-panel
      dockerfile: Dockerfile
    container_name: cs16-panel
    network_mode: host
    restart: unless-stopped
    environment:
      ASPNETCORE_URLS: http://0.0.0.0:8080
      CS_SERVER_HOST: 127.0.0.1
      CS_SERVER_PORT: 27015
      CS_RCON_PASSWORD: ${RCON_PASSWORD}
      MAPS_PATH: /maps
      PUBLIC_HOST: ${PUBLIC_HOST:-YOUR_PUBLIC_HOST}
      PUBLIC_PORT: ${SERVER_PORT:-27015}
    volumes:
      - ./serverdata/default/cstrike/maps:/maps:ro
